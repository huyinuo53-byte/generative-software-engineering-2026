&lt;/style&gt;&lt;/head&gt;&lt;body&gt;&lt;main&gt;&lt;header&gt;&lt;div class=&quot;eyebrow&quot;&gt;NJU · 2026 · 课程阅读索引&lt;/div&gt;&lt;h1&gt;生成式软件工程&lt;/h1&gt;&lt;p&gt;按视频整理的完整笔记。保留时间码、讲义和现场演示，并区分课堂讲述、现行讲义补充与整理者解释。&lt;/p&gt;&lt;strong&gt;7 堂课程 + 1 个改编短片 · 163 节 · 311 幅图&lt;/strong&gt;&lt;/header&gt;
&lt;a class=&quot;card &quot; href=&quot;lecture-01/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;01&lt;/div&gt;&lt;div&gt;&lt;h2&gt;欢迎来到未来&lt;/h2&gt;&lt;p&gt;Agent 如何进入生活、学习和工程；qrgen 的失败与架构转折。&lt;/p&gt;&lt;small&gt;23 节 · 48 幅配图 · 12 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card &quot; href=&quot;lecture-02/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;02&lt;/div&gt;&lt;div&gt;&lt;h2&gt;提示词工程&lt;/h2&gt;&lt;p&gt;上下文、可验证规格、分解与反馈，以及读论文和开放探索。&lt;/p&gt;&lt;small&gt;28 节 · 44 幅配图 · 5 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card &quot; href=&quot;lecture-03/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;03&lt;/div&gt;&lt;div&gt;&lt;h2&gt;软件仓库管理&lt;/h2&gt;&lt;p&gt;从项目快照到真实 Git 对象、冲突、提交与协作。&lt;/p&gt;&lt;small&gt;25 节 · 53 幅配图 · 5 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card &quot; href=&quot;lecture-04/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;04&lt;/div&gt;&lt;div&gt;&lt;h2&gt;软件仓库管理（2）&lt;/h2&gt;&lt;p&gt;修改与历史、Jujutsu、并发控制、工作区和个人助手实验。&lt;/p&gt;&lt;small&gt;19 节 · 35 幅配图 · 7 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card latest&quot; href=&quot;lecture-05/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;05&lt;/div&gt;&lt;div&gt;&lt;h2&gt;软件工程的来龙去脉&lt;/h2&gt;&lt;span class=&quot;badge&quot;&gt;最新三集 · 重点提质&lt;/span&gt;&lt;p&gt;需求与实现之间的距离、设计流程、契约、UML 与可靠反馈。&lt;/p&gt;&lt;small&gt;16 节 · 40 幅配图 · 12 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card latest&quot; href=&quot;lecture-06/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;06&lt;/div&gt;&lt;div&gt;&lt;h2&gt;需求和架构（1）&lt;/h2&gt;&lt;span class=&quot;badge&quot;&gt;最新三集 · 重点提质&lt;/span&gt;&lt;p&gt;教务系统需求、汉诺塔架构、时间、事件与可追溯的变化。&lt;/p&gt;&lt;small&gt;20 节 · 37 幅配图 · 5 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card latest&quot; href=&quot;lecture-07/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;07&lt;/div&gt;&lt;div&gt;&lt;h2&gt;需求和架构（2）&lt;/h2&gt;&lt;span class=&quot;badge&quot;&gt;最新三集 · 重点提质&lt;/span&gt;&lt;p&gt;经典抽象、可生长的接口、MVC/MVVM，以及事实与派生状态。&lt;/p&gt;&lt;small&gt;25 节 · 46 幅配图 · 9 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;a class=&quot;card &quot; href=&quot;extra-ai-slop/课堂笔记.html&quot;&gt;&lt;div class=&quot;number&quot;&gt;短片&lt;/div&gt;&lt;div&gt;&lt;h2&gt;失败的 AI Slop 数字永生尝试&lt;/h2&gt;&lt;p&gt;AI 改编中的教育焦虑与图文偏移；约 2 分 49 秒的独立短片。&lt;/p&gt;&lt;small&gt;7 节 · 8 幅配图 · 4 道自测&lt;/small&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;
&lt;details&gt;&lt;summary&gt;阅读方式与核验范围&lt;/summary&gt;&lt;p&gt;每课为独立 HTML，正文和图片均内嵌，可单独保存到手机离线阅读。点击目录定位章节；点击图片后可切换 2×、3× 放大。视频及原始网页链接需要联网。&lt;/p&gt;&lt;p&gt;复用第 02、05、06、07 课已有转写；第 01、03、04 课和短片补做转写。全部导出转写按块读完，逐句归属到正文小节；画面按讲义页及重点演示检查，没有逐秒听审整套视频。&lt;/p&gt;&lt;p&gt;已完成内容复核、逐图检查、390px 窄屏与桌面浏览器测试，以及打印正文与配图检查。未在真实手机设备上测试。官网讲义为本次获取的版本，可能含课后补注；原视频分辨率、音频问题和其他来源边界在各课开头说明。&lt;/p&gt;&lt;/details&gt;&lt;footer&gt;&lt;a href=&quot;https://space.bilibili.com/202224425/lists/8942017?type=season&quot;&gt;Bilibili 原合集&lt;/a&gt; · &lt;a href=&quot;https://jyywiki.cn/GSE/2026/&quot;&gt;官方课程网站&lt;/a&gt;&lt;p&gt;资料获取：2026-10-02。每课附独立的 review.json、图像审核和来源索引；本索引与单课文件置于同一目录树时可完整跳转。&lt;/p&gt;&lt;/footer&gt;&lt;/main&gt;&lt;/body&gt;&lt;/html&gt;"></iframe>
