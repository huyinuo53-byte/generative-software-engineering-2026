<h1>架构的假设，也有有效期</h1>
<p>架构与需求吻合时，就是便利；假设改变时，抽象开始泄漏，架构就成为阻力。</p>
<h2>社会不断打破旧假设</h2>
<ul>
<li>人类社会的进步导致旧系统做出的假设不断被打破</li>
<li>新产业诞生，旧产业消亡</li>
<li>人才的流转、阶级的流动</li>
</ul>
<h2>电力改变的不只是动力源</h2>
<ul>
<li><span class="aigc">蒸汽工厂：机器布局受传动轴、皮带约束；独立电机让设备可以按生产流程重新排列。<a href="https://gwern.net/doc/economics/automation/1990-david.pdf">David, 1990</a></span></li>
<li><span class="aigc">沿用旧厂房布局，也能用上电；重组设备与生产流程，才能进一步兑现新技术的收益。</span></li>
<li><span class="aigc">旧假设会固化在厂房、岗位、流程和投资里；技术已经变了，组织可能还在围着“传动轴”转。</span></li>
</ul>
